name: Weekly link check (lychee)
on:
  schedule:
    # 每週一 00:00 UTC = 台北 08:00
    - cron: '0 0 * * 1'
  workflow_dispatch:

jobs:
  link-check:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      issues: write

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Restore lychee cache
        uses: actions/cache/restore@v4
        with:
          path: .lycheecache
          key: cache-lychee-${{ github.run_id }}
          restore-keys: |
            cache-lychee-

      - name: Expand sitemap URLs
        run: |
          set -euo pipefail
          python - <<'PY'
          import urllib.parse
          import xml.etree.ElementTree as ET
          from dataclasses import dataclass
          from pathlib import Path
          import urllib.request

          @dataclass
          class Site:
            url: str
            base_url: str

          def read_lines(path: Path):
            for line in path.read_text(encoding="utf-8").splitlines():
              line = line.strip()
              if not line or line.startswith('#'):
                continue
              yield line

          def fetch(url: str, timeout: float = 20.0) -> str:
            with urllib.request.urlopen(url, timeout=timeout) as resp:
              return resp.read().decode('utf-8', errors='replace')

          def parse_sitemap(root: ET.Element, base_url: str, out: list[str]):
            ns = {'sm': 'http://www.sitemaps.org/schemas/sitemap/0.9'}
            if root.tag.endswith('sitemapindex'):
              for loc in root.findall('.//sm:loc', ns):
                url = loc.text.strip()
                if url:
                  out.append(url)
            else:
              # urlset
              for loc in root.findall('.//sm:loc', ns):
                url = loc.text.strip()
                if url:
                  out.append(url)

          def expand_sitemap(url: str, seen: set[str], out: list[str], base_url: str):
            if url in seen:
              return
            seen.add(url)
            try:
              text = fetch(url)
            except Exception:
              return
            try:
              root = ET.fromstring(text)
            except ET.ParseError:
              return

            if root.tag.endswith('sitemapindex'):
              items: list[str] = []
              parse_sitemap(root, base_url, items)
              for child in items:
                expand_sitemap(child, seen, out, base_url)
            else:
              parse_sitemap(root, base_url, out)

          base = 'https://www.papershoot.com'
          expanded: list[str] = []

          urls_txt = Path('urls.txt')
          if urls_txt.exists():
            expanded.extend(read_lines(urls_txt))

          extra_urls = Path('extra_urls.txt')
          if extra_urls.exists():
            expanded.extend(read_lines(extra_urls))

          extra_sitemaps = Path('extra_sitemaps.txt')
          if extra_sitemaps.exists():
            expanded.extend(read_lines(extra_sitemaps))

          # Try common sitemap endpoints.
          sitemap_candidates = [
            f"{base}/sitemap.xml",
            f"{base}/sitemap_index.xml",
            f"{base}/sitemap-index.xml",
            f"{base}/sitemapindex.xml",
          ]

          seen: set[str] = set()
          sitemap_urls: list[str] = []
          for sm in sitemap_candidates:
            expand_sitemap(sm, seen, sitemap_urls, base)

          expanded.extend(sitemap_urls)

          # Add key landing page (marketing)
          expanded.append('https://www.papershoot.com/products/paper-shoot-camera')

          # Deduplicate while preserving order
          deduped: list[str] = []
          seen_target: set[str] = set()
          for u in expanded:
            if u not in seen_target:
              deduped.append(u)
              seen_target.add(u)

          Path('expanded_urls.txt').write_text('\n'.join(deduped), encoding='utf-8')
          PY

      - name: Run lychee
        id: lychee
        uses: lycheeverse/lychee-action@v2
        continue-on-error: true
        with:
          args: --config lychee.toml --cache --format json --output report.json --files-from expanded_urls.txt

      - name: Build report.md
        run: |
          python - <<'PY'
          import json
          import pathlib

          path = pathlib.Path('report.json')
          md = ['Link check report\n']
          if not path.exists():
            md.append('report.json was not generated.\n')
          else:
            raw = path.read_text(encoding='utf-8')
            try:
              data = json.loads(raw)
              failures = data.get('failures', [])
              if not failures:
                md.append('No broken links detected.\n')
              else:
                md.append(f"Broken links detected: {len(failures)}\n\n")
                for i, fail in enumerate(failures, 1):
                  target = fail.get('target', '')
                  status = fail.get('status', '')
                  md.append(f"{i}. {target} (status: {status})\n")
            except Exception:
              md.append('report.json is not valid JSON; raw content follows:\n\n')
              md.append(raw)
          pathlib.Path('report.md').write_text(''.join(md), encoding='utf-8')
          PY

      - name: Upload reports (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: link-check-reports
          path: |
            expanded_urls.txt
            report.json
            report.md
          if-no-files-found: warn

      - name: Post Slack notification (lychee failed)
        if: steps.lychee.outcome == 'failure'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -z "${SLACK_WEBHOOK_URL:-}" ]; then
            exit 0
          fi

          STATUS="✅ No broken links"
          STATUS="❌ Broken links detected"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          cat <<EOF >/tmp/slack.json
          {"text":"Link check status: $STATUS\nRun URL: $RUN_URL"}
          EOF
          curl -X POST -H 'Content-type: application/json' --data @/tmp/slack.json "$SLACK_WEBHOOK_URL"

      - name: Create issue if failed
        if: steps.lychee.outcome == 'failure'
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: "Broken links detected (lychee)"
          content-filepath: report.md
          labels: |
            link-check
            priority:medium
          assignees: |
            Georgelin0525

      - name: Fail job if lychee found issues
        if: steps.lychee.outcome == 'failure'
        run: exit 1
