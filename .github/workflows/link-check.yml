name: Weekly link check (lychee)

on:
  schedule:
    # 每週一 00:00 UTC = 台北 08:00
    - cron: '0 0 * * 1'
  workflow_dispatch:

jobs:
  link-check:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      issues: write

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Restore lychee cache
        uses: actions/cache/restore@v4
        with:
          path: .lycheecache
          key: cache-lychee-${{ github.run_id }}
          restore-keys: |
            cache-lychee-

      - name: Expand sitemap URLs
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import urllib.parse
          import urllib.request
          import xml.etree.ElementTree as ET

          USER_AGENT = "PaperShoot-LinkCheck/1.0"

          def read_list(path):
              items = []
              try:
                  with open(path, "r", encoding="utf-8") as f:
                      for line in f:
                          line = line.strip()
                          if not line or line.startswith("#"):
                              continue
                          items.append(line)
              except FileNotFoundError:
                  pass
              return items

          def fetch(url):
              req = urllib.request.Request(url, headers={"User-Agent": USER_AGENT})
              with urllib.request.urlopen(req, timeout=30) as resp:
                  return resp.read()

          NS = "{http://www.sitemaps.org/schemas/sitemap/0.9}"

          def parse_sitemap(xml_bytes):
              root = ET.fromstring(xml_bytes)
              if root.tag.endswith("sitemapindex"):
                  locs = []
                  for sm in root.findall(NS + "sitemap"):
                      loc = sm.findtext(NS + "loc")
                      if loc:
                          locs.append(loc.strip())
                  return ("index", locs)
              if root.tag.endswith("urlset"):
                  locs = []
                  for u in root.findall(NS + "url"):
                      loc = u.findtext(NS + "loc")
                      if loc:
                          locs.append(loc.strip())
                  return ("urlset", locs)
              raise ValueError(f"Unknown sitemap root: {root.tag}")

          def normalize(u):
              return urllib.parse.urlsplit(u).geturl().strip()

          urls = set(normalize(u) for u in read_list("urls.txt"))
          urls.update(normalize(u) for u in read_list("extra_urls.txt"))

          # 加固：廣告 Landing page
          urls.add(normalize("https://www.papershoot.com/products/paper-shoot-camera"))

          base_hosts = set()
          for u in urls:
              split = urllib.parse.urlsplit(u)
              base_hosts.add((split.scheme or "https", split.netloc))

          sitemap_candidates = set()
          for scheme, netloc in base_hosts:
              if not netloc:
                  continue
              root = f"{scheme}://{netloc}"
              sitemap_candidates.update(
                  [
                      f"{root}/sitemap.xml",
                      f"{root}/sitemap_index.xml",
                      f"{root}/sitemap-index.xml",
                      f"{root}/sitemapindex.xml",
                  ]
              )

          sitemap_candidates.update(normalize(u) for u in read_list("extra_sitemaps.txt"))

          visited_sitemaps = set()
          queue = list(sorted(sitemap_candidates))
          found = set(urls)

          def add_queue(s):
              s = normalize(s)
              if s not in visited_sitemaps:
                  queue.append(s)

          while queue:
              sm = queue.pop(0)
              sm = normalize(sm)
              if sm in visited_sitemaps:
                  continue
              visited_sitemaps.add(sm)
              try:
                  xml_bytes = fetch(sm)
                  kind, locs = parse_sitemap(xml_bytes)
                  if kind == "index":
                      for loc in locs:
                          add_queue(loc)
                  elif kind == "urlset":
                      for loc in locs:
                          found.add(normalize(loc))
              except Exception as e:
                  print(f"Skipped sitemap fetch/parsing: {sm} ({e})")

          with open("expanded_urls.txt", "w", encoding="utf-8") as f:
              for u in sorted(found):
                  f.write(u + "\n")

          print(
              f"Wrote expanded_urls.txt with {len(found)} URLs (from {len(visited_sitemaps)} sitemaps)"
          )
          PY

      - name: Run lychee
        id: lychee
        uses: lycheeverse/lychee-action@v2
        continue-on-error: true
        with:
          args: >
            --config lychee.toml
            --cache
            --max-cache-age 7d
            @expanded_urls.txt
          output: report.json

      - name: Build report.md
        run: |
          set -euo pipefail
          python - <<'PY'
          import json

          report_md = "# Link check report\n\n"

          try:
              data = open("report.json", "r", encoding="utf-8").read()
          except FileNotFoundError:
              report_md += "report.json is missing.\n"
              open("report.md", "w", encoding="utf-8").write(report_md)
              raise SystemExit(0)

          stripped = data.strip()
          loaded = None

          if stripped:
              try:
                  loaded = json.loads(stripped)
              except Exception:
                  # try lenient: find first brace
                  try:
                      start = stripped.index("{")
                      end = stripped.rindex("}")
                      loaded = json.loads(stripped[start : end + 1])
                  except Exception:
                      loaded = None

          if loaded is None:
              report_md += "report.json is not valid JSON; raw content follows:\n\n"
              report_md += "```json\n" + data + "\n```\n"
          else:
              report_md += "Parsed lychee JSON.\n\n"

              failures = []
              if isinstance(loaded, dict):
                  results = (
                      loaded.get("results")
                      or loaded.get("links")
                      or loaded.get("failures")
                      or []
                  )
                  if isinstance(results, dict):
                      for v in results.values():
                          if isinstance(v, list):
                              failures.extend(v)
                  elif isinstance(results, list):
                      failures = results
              elif isinstance(loaded, list):
                  failures = loaded

              report_md += "## Failures\n"
              if not failures:
                  report_md += "No failures detected.\n"
              else:
                  for item in failures[:200]:
                      url = item.get("link") or item.get("url") or item.get("target") or ""
                      status = item.get("status") or item.get("error") or item.get("reason") or ""
                      source = item.get("source") or item.get("ref") or ""
                      report_md += f"- {status} {url} (source: {source})\n"

          open("report.md", "w", encoding="utf-8").write(report_md)
          PY

      - name: Save lychee cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .lycheecache
          key: cache-lychee-${{ github.run_id }}

      - name: Upload reports (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: link-check-reports
          path: |
            expanded_urls.txt
            report.json
            report.md
          if-no-files-found: warn

      - name: Post Slack notification (lychee failed)
        if: steps.lychee.outcome == 'failure'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [[ -z "${SLACK_WEBHOOK_URL}" ]]; then
            echo "SLACK_WEBHOOK_URL not set; skipping Slack notification"
            exit 0
          fi
          RUN_URL="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          MSG="Link check failed: ${RUN_URL}"
          curl -X POST -H 'Content-type: application/json' --data "{\"text\":\"${MSG}\"}" "$SLACK_WEBHOOK_URL"

      - name: Create issue if failed
        if: steps.lychee.outcome == 'failure'
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: Broken links detected (lychee)
          content-filepath: report.md
          labels: |
            link-check
            priority:medium
          assignees: |
            Georgelin0525

      - name: Fail job if lychee found issues
        if: steps.lychee.outcome == 'failure'
        run: exit 1
