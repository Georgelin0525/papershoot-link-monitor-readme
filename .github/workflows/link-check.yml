name: Weekly link check (lychee)
on:
  schedule:
    # 每週一 00:00 UTC = 台北 08:00
    - cron: '0 0 * * 1'
  workflow_dispatch:

jobs:
  link-check:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      issues: write

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Restore lychee cache
        uses: actions/cache/restore@v4
        with:
          path: .lycheecache
          key: cache-lychee-${{ github.run_id }}
          restore-keys: cache-lychee-

      - name: Expand sitemap URLs
        run: |
          set -euo pipefail
          python - <<'PY'
          import urllib.request
          import xml.etree.ElementTree as ET
          import ssl
          from pathlib import Path

          urlset = {"https://linktr.ee/papershootcam"}
          urls_file = Path("urls.txt")
          if urls_file.exists():
            for line in urls_file.read_text(encoding="utf-8").splitlines():
              line = line.strip()
              if line:
                urlset.add(line)

          sitemap_url = "https://www.papershoot.com/sitemap.xml"

          try:
            ctx = ssl.create_default_context()
            with urllib.request.urlopen(sitemap_url, context=ctx, timeout=20) as resp:
              data = resp.read()
            root = ET.fromstring(data)
            for loc in root.findall('.//{http://www.sitemaps.org/schemas/sitemap/0.9}loc'):
              if loc.text:
                urlset.add(loc.text.strip())
          except Exception as e:
            print(f"Skipped sitemap fetch: {e}")

          out = Path("expanded_urls.txt")
          out.write_text("\n".join(sorted(urlset)), encoding="utf-8")
          print(f"Wrote {len(urlset)} URLs to {out}")
          PY

      - name: Run lychee
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: |
            --config lychee.toml
            --cache
            --max-cache-age 7d
            --format json --output report.json
            @expanded_urls.txt
        continue-on-error: true

      - name: Build report.md
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path

          md = ["## Lychee report"]
          json_path = Path("report.json")
          if json_path.exists():
            md.append("```json")
            md.append(json_path.read_text(encoding="utf-8").strip())
            md.append("```")
          else:
            md.append("_No report.json produced; see workflow logs._")

          Path("report.md").write_text("\n".join(md), encoding="utf-8")
          PY

      - name: Save lychee cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .lycheecache
          key: cache-lychee-${{ github.run_id }}

      - name: Upload reports (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: link-check-reports
          path: |
            expanded_urls.txt
            report.json
            report.md
          if-no-files-found: warn

      - name: Fail if lychee found issues
        if: steps.lychee.outcome == 'failure'
        run: exit 1

      - name: Create issue if failed
        if: failure()
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: "Broken links detected (lychee)"
          content-filepath: report.md
          labels: |
            link-check
            priority:medium
          assignees: Georgelin0525
