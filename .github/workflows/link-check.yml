name: Weekly link check (lychee)

on:
  schedule:
    # 每週一 00:00 UTC = 台北 08:00
    - cron: '0 0 * * 1'
  workflow_dispatch:

jobs:
  link-check:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      issues: write

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Restore lychee cache
        uses: actions/cache/restore@v4
        with:
          path: .lycheecache
          key: cache-lychee-${{ github.run_id }}
          restore-keys: cache-lychee-

      - name: Expand sitemap URLs
        run: |
          set -euo pipefail
          python - <<'PY'
          import urllib.request
          import xml.etree.ElementTree as ET
          import ssl

          urls = []
          with open("urls.txt", "r", encoding="utf-8") as f:
              for line in f:
                  line = line.strip()
                  if line:
                      urls.append(line)

          # Explicitly include Linktree entry
          urls.append("https://linktr.ee/papershootcam")

          # Try papershoot sitemap
          try:
              ssl_context = ssl.create_default_context()
              with urllib.request.urlopen("https://www.papershoot.com/sitemap.xml", context=ssl_context, timeout=30) as resp:
                  data = resp.read()

              root = ET.fromstring(data)
              ns = {"sm": "http://www.sitemaps.org/schemas/sitemap/0.9"}
              for loc in root.findall(".//sm:loc", ns):
                  u = loc.text.strip()
                  if u not in urls:
                      urls.append(u)

              print(f"Added {len(urls)} URLs (including sitemap)")
          except Exception as e:
              print(f"Skipped sitemap fetch: {e}")

          with open("expanded_urls.txt", "w", encoding="utf-8") as f:
              f.write("\n".join(urls))
          PY

      - name: Run lychee
        id: lychee
        uses: lycheeverse/lychee-action@v2
        continue-on-error: true
        with:
          args: >
            --config lychee.toml
            --cache
            --max-cache-age 7d
            --format json --output report.json
            @expanded_urls.txt

      - name: Build report.md
        if: always()
        run: |
          set -euo pipefail
          if [ -f report.json ]; then
            echo "## Lychee report" > report.md
            echo "" >> report.md
            echo '```json' >> report.md
            cat report.json >> report.md
            echo '```' >> report.md
          else
            echo "## Lychee report" > report.md
            echo "report.json was not generated." >> report.md
          fi

      - name: Save lychee cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .lycheecache
          key: cache-lychee-${{ github.run_id }}

      - name: Upload reports (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: link-check-reports
          path: |
            expanded_urls.txt
            report.json
            report.md
          if-no-files-found: warn

      - name: Post Slack notification (lychee failed)
        if: steps.lychee.outcome == 'failure'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "${SLACK_WEBHOOK_URL:-}" ]; then
            echo "No Slack webhook configured; skipping."
            exit 0
          fi

          curl -X POST -H 'Content-type: application/json' --data "{\"text\":\"Lychee link check failed in repo *${GITHUB_REPOSITORY}*. Run: ${RUN_URL}\"}" "$SLACK_WEBHOOK_URL"

      - name: Fail if lychee found issues
        if: steps.lychee.outcome == 'failure'
        run: exit 1

      - name: Create issue if failed
        if: failure()
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: "Broken links detected (lychee)"
          content-filepath: report.md
          labels: |
            link-check
            priority:medium
          assignees: |
            Georgelin0525
