name: Weekly link check (lychee)
on:
  schedule:
    # 每週一 00:00 UTC = 台北 08:00
    - cron: '0 0 * * 1'
  workflow_dispatch:

jobs:
  link-check:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      issues: write

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Restore lychee cache
        uses: actions/cache/restore@v4
        with:
          path: .lycheecache
          key: cache-lychee-${{ github.run_id }}
          restore-keys: |
            cache-lychee-

      - name: Expand sitemap URLs
        run: |
          set -euo pipefail

          python - <<'PY'
          import os
          from urllib.parse import urljoin
          import urllib.request
          import urllib.error
          import xml.etree.ElementTree as ET

          def read_lines(path):
            urls = []
            try:
              with open(path, "r", encoding="utf-8") as f:
                for line in f:
                  line = line.strip()
                  if not line or line.startswith("#"):
                    continue
                  urls.append(line)
            except FileNotFoundError:
              pass
            return urls

          def fetch(url):
            try:
              with urllib.request.urlopen(url) as resp:
                return resp.read()
            except Exception as e:
              print(f"[WARN] fetch failed: {url} ({e})")
              return None

          def parse_sitemap(content, base_url, out_urls, max_depth):
            """Populate out_urls with <loc> URLs.
            Handles urlset and sitemapindex recursively up to max_depth.
            """
            try:
              root = ET.fromstring(content)
            except ET.ParseError as e:
              print(f"[WARN] parse error {base_url}: {e}")
              return

            ns = "{http://www.sitemaps.org/schemas/sitemap/0.9}"

            if root.tag == ns + "urlset":
              for url_el in root.findall(ns + "url"):
                loc_el = url_el.find(ns + "loc")
                if loc_el is None or not loc_el.text:
                  continue
                out_urls.add(loc_el.text.strip())

            elif root.tag == ns + "sitemapindex":
              if max_depth <= 0:
                return
              for sm_el in root.findall(ns + "sitemap"):
                loc_el = sm_el.find(ns + "loc")
                if loc_el is None or not loc_el.text:
                  continue
                sm_url = loc_el.text.strip()
                content2 = fetch(sm_url)
                if content2 is None:
                  continue
                parse_sitemap(content2, sm_url, out_urls, max_depth - 1)

          targets = set()
          targets.update(read_lines("urls.txt"))
          targets.update(read_lines("extra_urls.txt"))

          sitemaps = []
          sitemaps.extend(read_lines("extra_sitemaps.txt"))

          # common sitemap candidates
          base = "https://www.papershoot.com"
          candidates = [
            "https://www.papershoot.com/sitemap.xml",
            "https://www.papershoot.com/sitemap_index.xml",
            "https://www.papershoot.com/sitemap-index.xml",
            "https://www.papershoot.com/sitemapindex.xml",
          ]

          # ensure marketing landing page always covered
          targets.add("https://www.papershoot.com/products/paper-shoot-camera")

          # avoid duplicates
          seen_cands = set()
          for u in candidates:
            seen_cands.add(u)
            content = fetch(u)
            if content is not None:
              parse_sitemap(content, u, targets, max_depth=2)

          for sm in sitemaps:
            if sm in seen_cands:
              continue
            seen_cands.add(sm)
            content = fetch(sm)
            if content is None:
              continue
            parse_sitemap(content, sm, targets, max_depth=3)

          # dedupe + stable ordering
          with open("expanded_urls.txt", "w", encoding="utf-8") as f:
            for u in sorted(targets):
              f.write(u + "\n")

          print(f"Expanded {len(targets)} URLs into expanded_urls.txt")
          PY

      - name: Run lychee
        id: lychee
        uses: lycheeverse/lychee-action@v2
        continue-on-error: true
        with:
          args: --config lychee.toml --cache --files-from expanded_urls.txt --format json --output report.json

      - name: Build report.md
        id: build_report
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report_json = Path("report.json")
          report_md = Path("report.md")

          failures_count = 0
          raw = ""

          if report_json.exists():
            raw = report_json.read_text(encoding="utf-8", errors="replace")

          def write_env():
            env_file = Path(os.environ["GITHUB_ENV"])
            env_file.write_text(env_file.read_text() + f"FAILURES_COUNT={failures_count}\n")

          report_lines = ["## Lychee Report"]

          if not raw:
            report_lines.append("report.json not generated")
          else:
            try:
              data = json.loads(raw)
              failures = data.get("failures")

              if isinstance(failures, list):
                failures_count = len(failures)
                report_lines.append(f"failures: {failures_count}")
                report_lines.append("")

                # try to render a simple table
                report_lines.append("| status | URL |")
                report_lines.append("|---|---|")
                for f in failures:
                  status = f.get("status") if isinstance(f, dict) else ""
                  url = f.get("target") if isinstance(f, dict) else ""
                  report_lines.append(f"| {status} | {url} |")
              else:
                report_lines.append("Could not locate 'failures' list in JSON.")
                report_lines.append("\n```json")
                report_lines.append(raw)
                report_lines.append("```")
            except Exception:
              failures_count = -1
              report_lines.append("report.json is not valid JSON")
              report_lines.append("\n```json")
              report_lines.append(raw)
              report_lines.append("```")

          report_md.write_text("\n".join(report_lines), encoding="utf-8")
          write_env()
          PY

      - name: Save lychee cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .lycheecache
          key: ${{ steps.restore_cache.outputs.cache-primary-key }}

      - name: Upload reports (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: link-check-reports
          path: |
            expanded_urls.txt
            report.json
            report.md
          if-no-files-found: warn

      - name: Post Slack notification (failures > 0)
        if: env.FAILURES_COUNT != '' && env.FAILURES_COUNT != '0'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          echo "Posting Slack notification..."
          escaped=$(printf '%s' "$RUN_URL" | python -c 'import json,sys;print(json.dumps(sys.stdin.read()))')
          payload=$(cat <<EOF
          {
            "text": "\ud83d\udd0e Link check detected issues (failures > 0)\nRun: $RUN_URL"
          }
          EOF
          )
          curl -s -X POST -H 'Content-type: application/json' --data "$payload" "$SLACK_WEBHOOK_URL" >/dev/null

      - name: Create issue if failures > 0
        if: env.FAILURES_COUNT != '' && env.FAILURES_COUNT != '0'
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: "Broken links detected (lychee)"
          content-filepath: report.md
          labels: |
            link-check
            priority:medium
          assignees: |
            Georgelin0525

      - name: Fail job if failures > 0
        if: env.FAILURES_COUNT != '' && env.FAILURES_COUNT != '0'
        run: exit 1
