name: Weekly link check (lychee)

on:
  schedule:
    # 每週一 00:00 UTC = 台北 08:00
    - cron: '0 0 * * 1'
  workflow_dispatch:

jobs:
  link-check:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      issues: write

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Restore lychee cache
        uses: actions/cache/restore@v4
        with:
          path: .lycheecache
          key: cache-lychee-${{ github.run_id }}
          restore-keys: |
            cache-lychee-

      - name: Expand sitemap URLs
        run: |
          set -euo pipefail

          python - <<'PY'
          import urllib.parse
          import urllib.request
          import xml.etree.ElementTree as ET

          USER_AGENT = "PaperShoot-LinkCheck/1.0"

          def read_list(path):
            items = []
            try:
              with open(path, "r", encoding="utf-8") as f:
                for line in f:
                  line = line.strip()
                  if not line or line.startswith("#"):
                    continue
                  items.append(line)
            except FileNotFoundError:
              pass
            return items

          def fetch(url):
            req = urllib.request.Request(url, headers={"User-Agent": USER_AGENT})
            with urllib.request.urlopen(req, timeout=30) as resp:
              return resp.read()

          NS = "{http://www.sitemaps.org/schemas/sitemap/0.9}"

          def parse_sitemap(xml_bytes):
            root = ET.fromstring(xml_bytes)
            if root.tag.endswith("sitemapindex"):
              locs = []
              for sm in root.findall(NS + "sitemap"):
                loc = sm.findtext(NS + "loc")
                if loc:
                  locs.append(loc.strip())
              return ("index", locs)
            if root.tag.endswith("urlset"):
              locs = []
              for u in root.findall(NS + "url"):
                loc = u.findtext(NS + "loc")
                if loc:
                  locs.append(loc.strip())
              return ("urlset", locs)
            raise ValueError(f"Unknown sitemap root: {root.tag}")

          def process_sitemap(url, seen, urls):
            url = url.strip()
            if not url:
              return
            if url in seen:
              return
            seen.add(url)

            # Ignore on-site relative references; treat them as URLs.
            if not urllib.parse.urlsplit(url).scheme:
              url = urllib.parse.urljoin("https://www.papershoot.com", url)

            try:
              xml_bytes = fetch(url)
            except Exception as e:
              print(f"Skipped sitemap fetch ({url}): {e}")
              return

            try:
              root_type, locs = parse_sitemap(xml_bytes)
            except Exception as e:
              print(f"Skipped sitemap parse ({url}): {e}")
              return

            if root_type == "index":
              for loc in locs:
                process_sitemap(loc, seen, urls)
            else:
              urls.extend(locs)

          base_urls = []
          base_urls.extend(read_list("urls.txt"))
          base_urls.extend(read_list("extra_urls.txt"))

          base_sitemaps = []
          base_sitemaps.extend(read_list("extra_sitemaps.txt"))
          base_sitemaps.extend([
            "https://www.papershoot.com/sitemap.xml",
            "https://www.papershoot.com/sitemap_index.xml",
            "https://www.papershoot.com/sitemap-index.xml",
            "https://www.papershoot.com/sitemapindex.xml",
          ])

          # Remove bad encoding artifacts and whitespace
          expanded = [url.strip() for url in base_urls if url.strip()]

          seen = set()
          for sm in base_sitemaps:
            process_sitemap(sm, seen, expanded)

          # Deduplicate
          expanded = list(dict.fromkeys(expanded))

          with open("expanded_urls.txt", "w", encoding="utf-8") as f:
            for url in expanded:
              f.write(url + "\n")

          print(f"Expanded URLs written: {len(expanded)}")
          PY

      - name: Run lychee
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: >
            --config lychee.toml
            --cache
            --max-cache-age 7d
            --format json
            --output report.json
            @expanded_urls.txt
        continue-on-error: true

      - name: Build report.md
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report_md = Path("report.md")

          if not Path("report.json").exists():
            report_md.write_text("report.json missing.\n", encoding="utf-8")
          else:
            raw = Path("report.json").read_text(encoding="utf-8", errors="replace")
            try:
              data = json.loads(raw)
              report_md.write_text(json.dumps(data, indent=2, ensure_ascii=False), encoding="utf-8")
            except Exception as e:
              report_md.write_text(
                f"Lychee report could not be parsed as JSON: {e}\n\nRaw content:\n\n```
{raw}
```\n",
                encoding="utf-8",
              )
          PY

      - name: Save lychee cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .lycheecache
          key: cache-lychee-${{ github.run_id }}

      - name: Upload reports (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: link-check-reports
          path: |
            expanded_urls.txt
            report.json
            report.md
          if-no-files-found: warn

      - name: Post Slack notification (lychee failed)
        if: steps.lychee.outcome == 'failure'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -z "${SLACK_WEBHOOK_URL:-}" ]; then
            echo "SLACK_WEBHOOK_URL not set; skipping Slack notification."
            exit 0
          fi

          RUN_URL="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          payload=$(cat <<'JSON'
          {
            "text": ":rotating_light: Lychee link check failed.\nRun: RUN_URL"
          }
          JSON
          )
          payload=${payload//RUN_URL/$RUN_URL}
          curl -X POST -H 'Content-type: application/json' --data "${payload}" "$SLACK_WEBHOOK_URL"

      - name: Fail if lychee found issues
        if: steps.lychee.outcome == 'failure'
        run: |
          echo "Broken links detected; failing job."
          exit 1

      - name: Create issue if failed
        if: failure()
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: "Broken links detected (lychee)"
          content-filepath: report.md
          labels: |
            link-check
            priority:medium
          assignees: |
            Georgelin0525
