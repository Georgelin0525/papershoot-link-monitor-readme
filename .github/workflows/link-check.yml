name: Weekly link check (lychee)

on:
  schedule:
    # 每週一 00:00 UTC = 台北 08:00
    - cron: '0 0 * * 1'
  workflow_dispatch:

jobs:
  link-check:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      issues: write

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Restore lychee cache
        uses: actions/cache/restore@v4
        with:
          path: .lycheecache
          key: cache-lychee-${{ github.run_id }}
          restore-keys: |
            cache-lychee-

      - name: Expand sitemap URLs
        run: |
          set -euo pipefail
          python - <<'PY'
          import urllib.request
          import xml.etree.ElementTree as ET
          import ssl

          urls = []
          with open('urls.txt', 'r') as f:
              for line in f:
                  line = line.strip()
                  if line:
                      urls.append(line)

          linktree = 'https://linktr.ee/papershootcam'
          if linktree not in urls:
              urls.append(linktree)

          sitemap_url = 'https://www.papershoot.com/sitemap.xml'
          try:
              ctx = ssl.create_default_context()
              with urllib.request.urlopen(sitemap_url, context=ctx, timeout=30) as response:
                  xml_content = response.read()

              root = ET.fromstring(xml_content)
              ns = {'sm': 'http://www.sitemaps.org/schemas/sitemap/0.9'}

              if root.tag.endswith('sitemapindex'):
                  for sitemap in root.findall('sm:sitemap', ns):
                      loc = sitemap.find('sm:loc', ns)
                      if loc is not None and loc.text:
                          urls.append(loc.text.strip())
              else:
                  for url_tag in root.findall('sm:url', ns):
                      loc = url_tag.find('sm:loc', ns)
                      if loc is not None and loc.text:
                          urls.append(loc.text.strip())
          except Exception as e:
              print(f"Skipped sitemap fetch due to: {e}", flush=True)

          with open('expanded_urls.txt', 'w') as out:
              out.write('\n'.join(urls))
              out.write('\n')
          PY

      - name: Run lychee
        id: lychee
        continue-on-error: true
        uses: lycheeverse/lychee-action@v2
        with:
          args: >
            --config lychee.toml
            --cache
            --max-cache-age 7d
            @expanded_urls.txt
          output: report.json

      - name: Build report.md
        if: always()
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          report_path = Path('report.json')
          md_path = Path('report.md')

          if report_path.exists():
              data = report_path.read_text()
              try:
                  json.loads(data)
              except json.JSONDecodeError:
                  md_path.write_text("Lychee report\nreport.json was generated but is not valid JSON.\n")
              else:
                  md_path.write_text("Lychee report\n```json\n" + data + "\n```\n")
          else:
              md_path.write_text("Lychee report\nreport.json was not generated.\n")
          PY

      - name: Save lychee cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .lycheecache
          key: cache-lychee-${{ github.run_id }}

      - name: Upload reports (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: link-check-reports
          path: |
            expanded_urls.txt
            report.json
            report.md
          if-no-files-found: warn

      - name: Post Slack notification (lychee failed)
        if: steps.lychee.outcome == 'failure'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          set -euo pipefail

          if [ -z "${SLACK_WEBHOOK_URL:-}" ]; then
            echo "No SLACK_WEBHOOK_URL configured; skipping Slack notification."
            exit 0
          fi

          RUN_URL="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          BRANCH="${GITHUB_REF##refs/heads/}"
          short_sha="${GITHUB_SHA::7}"

          payload=$(cat <<EOF
          {
            "text": "Lychee link-check failed in \`${GITHUB_REPOSITORY}\`\nBranch: \`${BRANCH}\` (commit: \`${short_sha}\`)\nRun: ${RUN_URL}"
          }
          EOF
          )

          curl -sSL -X POST \
            -H 'Content-type: application/json' \
            --data "$payload" \
            "$SLACK_WEBHOOK_URL"

      - name: Fail if lychee found issues
        if: steps.lychee.outcome == 'failure'
        run: exit 1

      - name: Create issue if failed
        if: failure()
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: "Broken links detected (lychee)"
          content-filepath: report.md
          labels: |
            link-check
            priority:medium
          assignees: Georgelin0525
