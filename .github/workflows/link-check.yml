name: Weekly link check (lychee)

on:
  schedule:
    # 每週一 00:00 UTC = 台北 08:00
    - cron: '0 0 * * 1'
  workflow_dispatch:

jobs:
  link-check:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      issues: write

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Restore lychee cache
        uses: actions/cache/restore@v4
        with:
          path: .lycheecache
          key: cache-lychee-${{ github.run_id }}
          restore-keys: cache-lychee-

      - name: Expand sitemap URLs
        run: |
          set -euo pipefail
          python - <<'PY'
          import urllib.request
          import xml.etree.ElementTree as ET
          import ssl
          from pathlib import Path

          urlset = {"https://linktr.ee/papershootcam"}

          urls_file = Path("urls.txt")
          if urls_file.exists():
            for line in urls_file.read_text(encoding="utf-8").splitlines():
              line = line.strip()
              if not line:
                continue
              urlset.add(line)

          # Best-effort: fetch sitemap to expand scope
          try:
            ctx = ssl.create_default_context()
            with urllib.request.urlopen("https://www.papershoot.com/sitemap.xml", context=ctx, timeout=20) as resp:
              data = resp.read()

            root = ET.fromstring(data)
            ns = {"sm": "http://www.sitemaps.org/schemas/sitemap/0.9"}
            for loc in root.findall(".//sm:loc", ns):
              if loc.text:
                urlset.add(loc.text.strip())
          except Exception as e:
            print(f"Skipped sitemap fetch: {e}")

          Path("expanded_urls.txt").write_text("\n".join(sorted(urlset)), encoding="utf-8")
          print(f"Wrote expanded_urls.txt with {len(urlset)} urls")
          PY

      - name: Run lychee
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: >
            --config lychee.toml
            --cache
            --max-cache-age 7d
            --format json --output report.json
            @expanded_urls.txt
        continue-on-error: true

      - name: Build report.md
        if: always()
        run: |
          python - <<'PY'
          import json, pathlib, datetime

          p = pathlib.Path("report.json")
          md = pathlib.Path("report.md")
          timestamp = datetime.datetime.utcnow().strftime("%Y-%m-%d %H:%M:%S UTC")

          if p.exists():
            data = p.read_text(encoding="utf-8")
            md.write_text(f"# Link check report\n\nTime: {timestamp}\n\n```json\n{data}\n```\n", encoding="utf-8")
          else:
            md.write_text(f"# Link check report\n\nTime: {timestamp}\n\nreport.json is missing.\n", encoding="utf-8")

          print("Wrote report.md")
          PY

      - name: Save lychee cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .lycheecache
          key: cache-lychee-${{ github.run_id }}

      - name: Upload reports (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: link-check-reports
          path: |
            report.json
            report.md
            expanded_urls.txt
          if-no-files-found: warn

      - name: Post Slack notification
        if: steps.lychee.outcome == 'failure' && secrets.SLACK_WEBHOOK_URL != ''
        env:
          WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          payload=$(cat <<JSON
          {"text":":rotating_light: Link check failed for *${{ github.repository }}* <${RUN_URL}|Run #${{ github.run_id }}> on `${{ github.ref }}`"}
          JSON
          )
          curl -X POST -H 'Content-type: application/json' --data "$payload" "$WEBHOOK_URL"

      - name: Fail if lychee found issues
        if: steps.lychee.outcome == 'failure'
        run: exit 1

      - name: Create issue if failed
        if: failure()
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: "Broken links detected (lychee)"
          content-filepath: report.md
          labels: |
            link-check
            priority:medium
          assignees: |
            Georgelin0525
